name: Build Master

on:
  push:
    branches: [master]

jobs:
  master:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: echo "APP_VERSION_NAME=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$APP_VERSION_NAME

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: release-${{ github.run_number }}
          commit: ${{ github.sha }}
          name: CI Build ${{ env.APP_VERSION_NAME }}
          body: |
            ## CI Build ${{ env.APP_VERSION_NAME }}

            **Commit:** ${{ github.sha }}
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          generateReleaseNotes: true