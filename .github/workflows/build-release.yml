name: Release (Play Store)

# Two ways to release:
#   * push a vX.Y.Z tag (manual/recovery path)
#   * Actions -> Release (Play Store) -> Run workflow, which bumps the semver, commits
#     android/version.properties + package.json + package-lock.json, builds, uploads, verifies,
#     and tags.
#
# The workflow owns the version: versionName comes from the tag (or the bump), and versionCode is
# max(seconds since 2025-01-01, previous committed code + 1). That keeps every Play upload
# strictly increasing even if a build is retried or the runner clock is corrected.
on:
  push:
    tags: ["v[1-9].*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver part to increment (ignored when version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version, e.g. 1.2.0 (optional; overrides bump)"
        required: false
        type: string
      track:
        description: "Play track to publish to"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: "Play release status (completed publishes immediately)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  # Serialize releases so two runs can never allocate the same versionCode or race the bump commit.
  group: play-store-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLAY_TRACK: ${{ github.event.inputs.track || vars.PLAY_TRACK || 'internal' }}
  PLAY_RELEASE_STATUS: ${{ github.event.inputs.release_status || vars.PLAY_RELEASE_STATUS || 'completed' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action splits this input on spaces, not newlines. Keep it on one line.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Check version files
        run: node scripts/version.mjs check

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        run: |
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "::error::KEYSTORE_FILE is not set. A release must not silently fall back to debug signing."
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD must all be set."
            exit 1
          fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; the signed AAB cannot be uploaded."
            exit 1
          fi
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Decode keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_FILE" | tr -d '\r' | base64 -d > android/keystore/vpnsky.jks
          test -s android/keystore/vpnsky.jks

      - name: Verify keystore credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore android/keystore/vpnsky.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Set version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Releases must be dispatched from master (got $GITHUB_REF)."
              exit 1
            fi
            if [ -n "${INPUT_VERSION:-}" ]; then
              NAME="${INPUT_VERSION#v}"
            else
              NAME="$(node scripts/version.mjs bump "${INPUT_BUMP:-patch}")"
            fi
            node scripts/version.mjs assert-newer "$NAME"
            if git rev-parse -q --verify "refs/tags/v$NAME" >/dev/null; then
              echo "::error::Tag v$NAME already exists. Re-run that tag's workflow to rebuild it, or pick a higher version."
              exit 1
            fi
          else
            NAME="${GITHUB_REF_NAME#v}"
            node scripts/version.mjs assert-latest "$NAME"
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $NAME is not MAJOR.MINOR.PATCH (expected a v1.2.3 tag or input)."
            exit 1
          fi
          CODE="$(node scripts/version.mjs code)"
          node scripts/version.mjs write "$NAME" "$CODE"
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Commit before building so the tag can point at the exact version that went to Play. The
      # [skip ci] marker keeps Build Master from producing a second artifact for this commit.
      - name: Commit version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/version.properties package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Version files already at $APP_VERSION_NAME; nothing to commit."
          else
            git commit -m "chore(release): v$APP_VERSION_NAME [skip ci]"
            if ! git push origin HEAD:master; then
              echo "::error::Could not push the version bump to master. Allow GitHub Actions to push, or release from a branch where it can."
              exit 1
            fi
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wingsheep.vpnsky
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_RELEASE_STATUS }}

      # The upload action only proves the edit was committed; read the track back so a draft or a
      # mis-targeted track fails the job instead of looking like a successful release.
      - name: Verify Play release
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          PLAY_TRACK="$PLAY_TRACK" \
          PLAY_VERSION_CODE="$APP_VERSION_CODE" \
          node scripts/play_verify.mjs

      # GITHUB_TOKEN-created refs do not trigger workflows, so this tag cannot re-enter this
      # workflow and upload the same release twice.
      - name: Tag release
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists."
          else
            git tag -a "$RELEASE_TAG" -m "VPNSky $APP_VERSION_NAME"
            git push origin "$RELEASE_TAG"
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.APP_VERSION_NAME }}
          body: |
            ## VPNSky ${{ env.APP_VERSION_NAME }}

            - **versionCode:** `${{ env.APP_VERSION_CODE }}`
            - **Play track:** `${{ env.PLAY_TRACK }}` (status `${{ env.PLAY_RELEASE_STATUS }}`)
            - **Commit:** `${{ env.RELEASE_SHA }}`
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          allowUpdates: true
          generateReleaseNotes: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
